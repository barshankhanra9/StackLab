name: Generate Android Signing Key

on:
  workflow_dispatch:
    inputs:
      store_password:
        description: 'Keystore & Key Password (min 6 chars)'
        required: true
        default: 'ChangeMe12345'
      key_alias:
        description: 'Key Alias'
        required: true
        default: 'stacklab_key'

jobs:
  generate-keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Keystore & Base64
        run: |
          keytool -genkeypair -v \
            -keystore stacklab-release.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias "${{ github.event.inputs.key_alias }}" \
            -storepass "${{ github.event.inputs.store_password }}" \
            -keypass "${{ github.event.inputs.store_password }}" \
            -dname "CN=StackLab, OU=Mobile, O=StackLab, L=City, S=State, C=IN"
          
          base64 -w 0 stacklab-release.jks > keystore_base64.txt

      - name: Upload Keystore Files (Private Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: android-signing-key
          path: |
            stacklab-release.jks
            keystore_base64.txt
          retention-days: 1
          
